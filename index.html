<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ETF와 국내 주식 테마, KRX 연기금 수급을 미니멀하게 정리하는 MYFMLV 투자 대시보드"
    />
    <title>MYFMLV Market</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <a class="brand" href="./">MYFMLV</a>
        <nav class="view-tabs" id="viewTabs" aria-label="시장 분류">
          <button class="active" type="button" data-view="stock">주식</button>
          <button type="button" data-view="etf">ETF</button>
        </nav>
      </header>

      <nav class="period-tabs" id="chartPeriodTabs" aria-label="차트 기간">
        <span>차트</span>
        <button type="button" data-chart-period="1">1일</button>
        <button class="active" type="button" data-chart-period="5">5일</button>
        <button type="button" data-chart-period="20">20일</button>
        <button type="button" data-chart-period="60">60일</button>
      </nav>

      <section class="view active" id="stockView" aria-label="주식">
        <nav class="sub-tabs primary-subtabs" id="stockCountryTabs" aria-label="주식 국가">
          <button class="active" type="button" data-stock-country="kr">국내</button>
          <button type="button" data-stock-country="us">미국</button>
        </nav>

        <section class="stock-country active" data-stock-country-pane="kr" aria-label="국내 주식">
          <nav class="sub-tabs" id="krStockSubTabs" aria-label="국내 주식 중분류">
            <button class="active" type="button" data-kr-stock-section="market">시장</button>
            <button type="button" data-kr-stock-section="theme">테마</button>
            <button type="button" data-kr-stock-section="pension">연기금 수급</button>
          </nav>

          <section class="stock-subview active" id="marketStockPane" data-kr-stock-pane="market" aria-label="국내 시장">
            <section class="stock-toolbar market-toolbar" aria-label="국내 시장 종목 검색">
              <div class="toolbar-head market-toolbar-head">
                <label class="search-box">
                  <span>종목 검색</span>
                  <input id="marketSearch" type="search" placeholder="종목명 또는 코드" autocomplete="off" />
                </label>
                <p class="toolbar-note">검색 결과는 시가총액, 거래대금, 등락폭을 같이 보여줍니다.</p>
              </div>
              <div class="search-results market-search-results" id="marketSearchResults" hidden></div>
            </section>
            <div class="section-grid compact" id="marketInsightGrid"></div>
            <div class="section-grid compact" id="marketRankingGrid"></div>
          </section>

          <section class="stock-subview" id="themeStockPane" data-kr-stock-pane="theme" aria-label="주식 테마">
            <div class="section-grid" id="themeSectionGrid"></div>
            <article class="wide-panel theme-detail" id="themeDetail"></article>
          </section>

          <section class="stock-subview" id="pensionStockPane" data-kr-stock-pane="pension" aria-label="연기금 수급">
            <section class="date-strip" aria-label="거래일 선택">
              <label class="trade-date-field">
                <span>거래일</span>
                <input id="tradeDateInput" type="text" inputmode="numeric" placeholder="YYYY.MM.DD" autocomplete="off" />
              </label>
              <div class="calendar-control">
                <button id="tradeDateCalendarButton" type="button" aria-label="달력에서 거래일 선택"><span class="calendar-icon" aria-hidden="true"></span></button>
                <input id="tradeDatePicker" type="date" aria-label="거래일 달력" />
              </div>
              <small id="tradeDateHint"></small>
            </section>

            <nav class="sub-tabs compact-subtabs" id="pensionSubTabs" aria-label="연기금 수급 중분류">
              <button class="active" type="button" data-pension-section="trend">매매 동향</button>
              <button type="button" data-pension-section="search">검색</button>
            </nav>

            <section class="pension-subview active" data-pension-pane="trend" aria-label="연기금 매매 동향">
              <div class="section-grid compact" id="pensionSectionGrid"></div>
            </section>

            <section class="pension-subview" data-pension-pane="search" aria-label="연기금 종목 검색">
              <section class="stock-toolbar" aria-label="연기금 종목 검색과 정렬">
                <div class="toolbar-head">
                  <label class="search-box">
                    <span>종목 검색</span>
                    <input id="stockSearch" type="search" placeholder="종목명 또는 코드" autocomplete="off" />
                  </label>
                  <div class="sort-row" id="sortRow">
                    <button class="active" type="button" data-sort="netBuy">순매수금액</button>
                    <button type="button" data-sort="netSell">순매도금액</button>
                    <button type="button" data-sort="buyStreak">연속 순매수</button>
                    <button type="button" data-sort="sellStreak">연속 순매도</button>
                    <button type="button" data-sort="buyToMarketCap">시총대비 매수금액</button>
                    <button type="button" data-sort="marketCapAsc">시가총액 작은순</button>
                  </div>
                </div>
                <div class="search-results" id="searchResults" hidden></div>
              </section>

              <article class="wide-panel">
                <div class="panel-head">
                  <div>
                    <p>DETAIL</p>
                    <h2>연기금 수급 랭킹</h2>
                  </div>
                  <span class="panel-meta" id="rankingMeta">20개 표시</span>
                </div>
                <div class="table-wrap">
                  <table>
                    <thead>
                      <tr>
                        <th>순위</th>
                        <th>종목</th>
                        <th>수급금액</th>
                        <th>수급수량</th>
                        <th>매수금액</th>
                        <th>시가총액</th>
                        <th>매수/시총</th>
                        <th>연속일</th>
                        <th>미니 차트</th>
                      </tr>
                    </thead>
                    <tbody id="stockTableBody">
                      <tr><td colspan="9">데이터를 불러오는 중입니다.</td></tr>
                    </tbody>
                  </table>
                </div>
                <button class="load-more" id="loadMoreButton" type="button" hidden>아래로 20개 더 보기 ↓</button>
              </article>
            </section>
          </section>
        </section>

        <section class="stock-country" data-stock-country-pane="us" aria-label="미국 주식">
          <div class="section-grid compact" id="usMarketGrid"></div>
        </section>
      </section>

      <section class="view" id="etfView" aria-label="ETF">
        <nav class="sub-tabs primary-subtabs" id="etfSubTabs" aria-label="ETF 중분류">
          <button class="active" type="button" data-etf-section="theme">테마</button>
          <button type="button" data-etf-section="search">검색</button>
          <button type="button" data-etf-section="us">국내상장 미국 ETF</button>
        </nav>

        <section class="etf-subview active" data-etf-pane="theme" aria-label="ETF 테마">
          <div class="section-grid compact" id="etfThemeGrid"></div>
        </section>

        <section class="etf-subview" data-etf-pane="search" aria-label="ETF 검색">
          <section class="stock-toolbar etf-toolbar" aria-label="ETF 검색">
            <div class="toolbar-head">
              <label class="search-box">
                <span>ETF 검색</span>
                <input id="etfSearch" type="search" placeholder="ETF명, 코드, 구성종목" autocomplete="off" />
              </label>
            </div>
          </section>
        </section>

        <section class="etf-subview" data-etf-pane="us" aria-label="국내상장 미국 ETF">
          <div class="section-grid compact" id="etfUsGrid"></div>
        </section>

        <section class="etf-layout">
          <article class="wide-panel">
            <div class="panel-head">
              <div>
                <p>ETF</p>
                <h2 id="etfListTitle">ETF 목록</h2>
              </div>
              <span class="panel-meta" id="etfListMeta">-</span>
            </div>
            <ol class="etf-list" id="etfList"></ol>
            <button class="load-more" id="etfLoadMoreButton" type="button" hidden>아래로 20개 더 보기 ↓</button>
          </article>
          <article class="wide-panel etf-detail" id="etfDetail"></article>
        </section>
      </section>

      <footer class="footer">
        <strong>MYFMLV</strong>
        <span>개인 데이터 정리용입니다. 투자 판단 책임은 사용자에게 있습니다.</span>
      </footer>
    </main>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>

name: Check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Validate and syntax check
        run: npm run check

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npm run test:e2e

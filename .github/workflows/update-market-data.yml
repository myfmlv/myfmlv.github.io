name: Update market data

on:
  workflow_dispatch:
  schedule:
    # 18:30 KST = 09:30 UTC, Monday-Friday
    - cron: '30 9 * * 1-5'

permissions:
  contents: write

concurrency:
  group: update-market-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install KRX browser runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install "playwright>=1.58,<2"
          python -m playwright install --with-deps chromium

      - name: Update all market data
        run: xvfb-run -a npm run update:data
        env:
          TZ: Asia/Seoul
          KRX_USERNAME: ${{ secrets.KRX_USERNAME }}
          KRX_PASSWORD: ${{ secrets.KRX_PASSWORD }}
          KRX_HEADLESS: "0"
          KRX_BROWSER_CHANNEL: ""
          KRX_SOURCE_DIR: ${{ secrets.KRX_SOURCE_DIR }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}

      - name: Validate data
        run: npm run validate:data

      - name: Check syntax and smoke tests
        run: npm run check

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No data changes."
            exit 0
          fi

          git add data package-lock.json package.json
          git commit -m "chore(data): update market data"
          git push
